[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "macro-research"
version = "0.1.0"
description = "A small toolkit for reproducible macroeconomic time-series research."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas==2.2.3",
    "numpy==2.1.3",
    "scipy==1.14.1",
    "statsmodels==0.14.4",
    "plotly==5.24.1",
    "streamlit==1.40.2",
    "matplotlib==3.9.2",
]

[project.optional-dependencies]
test = ["pytest==8.3.4"]

[tool.setuptools]
packages = ["macro_research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
